<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#121620" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.35" />

  <!-- Speed lines & Track Grid -->
  <path d="M64 384 L448 384" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.2" />
  <path d="M96 416 L416 416" stroke="#ff0055" stroke-width="2" stroke-opacity="0.25" />
  <path d="M140 448 L372 448" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3" />

  <!-- 360 Tunnel Circle -->
  <circle cx="256" cy="220" r="130" fill="none" stroke="#1e2538" stroke-width="6" />
  <circle cx="256" cy="220" r="130" fill="none" stroke="url(#cyberGlow)" stroke-width="4" stroke-dasharray="24 16" filter="url(#neonBloom)" />

  <!-- Dynamic Cyber Racing Dart / Delta Wing -->
  <path d="M256 120 L350 280 L256 248 L162 280 Z" fill="url(#cyberGlow)" filter="url(#neonBloom)" />
  <!-- Cockpit Voxel Visor -->
  <polygon points="256,150 284,230 256,218 228,230" fill="#ffffff" opacity="0.9" />

  <!-- Neon Thruster Exhaust -->
  <path d="M240 256 L256 310 L272 256 Z" fill="#00f0ff" filter="url(#neonBloom)" />

  <!-- Logo Typography -->
  <text x="256" y="380" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="6" text-anchor="middle">UNLIMITED</text>
  <text x="256" y="412" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="16" fill="#00f0ff" letter-spacing="8" text-anchor="middle">// RUSH //</text>
</svg>
